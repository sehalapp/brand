name: Deploy brand site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      # Only the guideline page and the downloadable vectors are published.
      # BRAND.md, CLAUDE.md and internal/ are deliberately not copied.
      - name: Prepare static site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html _site/
          cp -R assets _site/assets
          # Pages serves no directory index for /assets/; this makes the
          # vectors browsable instead of 404-ing.
          {
            echo '<!doctype html><html lang="en"><head><meta charset="utf-8">'
            echo '<title>Sehal brand assets</title>'
            echo '<style>body{font:16px/1.6 system-ui,sans-serif;margin:3rem auto;max-width:44rem;padding:0 1.25rem;background:#020617;color:#F8FAFC}'
            echo 'a{color:#5FD693}h1{font-size:1.25rem}li{margin:.35rem 0}</style></head><body>'
            echo '<h1>Sehal brand assets</h1><ul>'
            for f in assets/*.svg; do
              n=$(basename "$f")
              echo "<li><a href=\"$n\">$n</a></li>"
            done
            echo '</ul><p><a href="../">&larr; Brand guidelines</a></p></body></html>'
          } > _site/assets/index.html
          echo "--- published tree ---"
          find _site -type f | sort

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
